<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universe Video</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
      flex-direction: column;
    }
    #overlay {
      position: absolute;
      z-index: 10;
      background-color: rgba(0, 0, 0, 0.8);
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      text-align: center;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="overlay">
    點擊以全螢幕播放影片
  </div>

  <video id="universeVideo" autoplay muted playsinline controls>
    <source src="https://raw.githubusercontent.com/syan-yooo/DsWave_2025/main/20250502_universe.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <script>
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('universeVideo');

    overlay.addEventListener('click', async () => {
      overlay.style.display = 'none';
      if (video.requestFullscreen) {
        await video.requestFullscreen();
      } else if (video.webkitRequestFullscreen) {
        await video.webkitRequestFullscreen();
      }
      video.play(); // 再次確保播放
    });
  </script>
</body>
</html>
